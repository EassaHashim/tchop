    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        var sel = function (s) { return '[data-composition-id="scene-2"] ' + s; };

        // Meta row
        tl.from(sel('.meta-row .scene-tag'),
          { y: -20, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.from(sel('.meta-row .timestamp'),
          { y: -20, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.22);

        // Panels slide in from sides simultaneously

          { x: -160, opacity: 0, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.3);
        tl.from(sel('#s2-right'),
          { x: 160, opacity: 0, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.3);

        // Divider scales up vertically
        tl.from(sel('#s2-divider'),
          { scaleY: 0, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.5);

        // Panel labels pop in
        tl.from(sel('#s2-left .panel-tag'),
          { y: -16, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.85);
        tl.from(sel('#s2-right .panel-tag'),
          { y: -16, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.95);

        // Terminal lines stagger in
        tl.from(sel('.t-line'),
          { x: -20, opacity: 0, duration: 0.28, stagger: 0.22, ease: "power2.out" }, 1.4);
        tl.from(sel('.t-cursor-line'),
          { opacity: 0, duration: 0.2, ease: "power2.out" }, 3.1);
        tl.to(sel('.t-cursor'),
          { opacity: 0.15, duration: 0.4, ease: "power1.inOut",
            repeat: 4, yoyo: true }, 3.3);

        // At ~3.2s — left panel "greys out" (desaturate + dim)

          { filter: "saturate(0.15) brightness(0.55) blur(1px)",
            opacity: 0.55, duration: 0.9, ease: "power2.inOut" }, 3.2);

        // Subtle "obsolete" stamp appears over left panel? No — keep it calm, just grey out.

          { filter: "drop-shadow(0 0 24px rgba(246,112,77,0.25))",
            duration: 0.8, ease: "power2.out" }, 3.4);
