    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var sel = function (s) { return '[data-composition-id="scene-3"] ' + s; };

        // Meta row
        tl.from(sel('.meta-row .scene-tag'),
          { y: -20, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.1);
        tl.from(sel('.meta-row .timestamp'),
          { y: -20, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.2);

        // Eyebrow scales in first
        tl.from(sel('#s3-eyebrow'),
          { scale: 0.85, y: 20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.3);

        // Wordmark letters stagger in with slight blur
        tl.from(sel('.wordmark span'), {
          y: 80,
          opacity: 0,
          filter: "blur(14px)",
          duration: 0.55,
          stagger: 0.065,
          ease: "power3.out"
        }, 0.55);

        // Tagline fades up
        tl.from(sel('#s3-tagline'),
          { y: 40, opacity: 0, filter: "blur(6px)", duration: 0.7, ease: "power3.out" }, 1.35);

        // Tagline accent highlights (separate sub-animation via color pop)
        tl.fromTo(sel('#s3-tagline .accent'),
          { color: "#F1F1F3" },
          { color: "#F6704D", duration: 0.4, ease: "power1.inOut" }, 1.95);

        // Pillars stagger in from left
        tl.from(sel('#s3-pillars .pillar'),
          { x: -24, opacity: 0, duration: 0.4, stagger: 0.1, ease: "power3.out" }, 2.2);
        tl.from(sel('#s3-pillars .pillar-sep'),
          { scale: 0, opacity: 0, duration: 0.3, stagger: 0.1, ease: "expo.out" }, 2.28);

        // Signature row fades in last
        tl.from(sel('.sig-row > *'),
          { y: 20, opacity: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 3.1);

        // Eyebrow dot pulse — finite repeats
        tl.to(sel('.eyebrow-dot'),
          { scale: 1.4, opacity: 0.5, duration: 0.7, ease: "sine.inOut",
            repeat: 3, yoyo: true }, 1.0);

        window.__timelines["scene-3"] = tl;
      })();
