    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var sel = function (s) { return '[data-composition-id="scene-5"] ' + s; };

        // Duration of this scene is 7s (from root). Last scene MAY fade out.
        // Entrance animations:

        // Meta row
        tl.from(sel('.meta-row .scene-tag'),
          { y: -20, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.1);
        tl.from(sel('.meta-row .timestamp'),
          { y: -20, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.2);

        // Message — slam in, word-stagger via line split (two lines via <br>)
        // Since I used <br> in a display headline where the break is deliberate,
        // split by line using spans.
        tl.from(sel('#s5-message'),
          { y: 70, opacity: 0, filter: "blur(14px)", duration: 0.75, ease: "power3.out" }, 0.3);
        // Accent color pops after entrance
        tl.fromTo(sel('#s5-message .accent'),
          { color: "#F1F1F3" },
          { color: "#F6704D", duration: 0.4, ease: "power1.inOut" }, 1.05);

        // CTA pill scales in with glow
        tl.from(sel('#s5-cta'),
          { scale: 0.85, opacity: 0, filter: "blur(6px)", duration: 0.55, ease: "expo.out" }, 1.3);
        tl.from(sel('#s5-cta .cta-arrow'),
          { x: -20, opacity: 0, duration: 0.4, ease: "power3.out" }, 1.6);
        tl.from(sel('.cta-sub'),
          { y: 14, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.8);

        // Footer row fades up
        tl.from(sel('.wordmark-small'),
          { y: 24, opacity: 0, duration: 0.5, ease: "power3.out" }, 2.1);
        tl.from(sel('.footer-meta > *'),
          { y: 16, opacity: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 2.3);

        // Subtle CTA glow breathe — finite
        tl.to(sel('#s5-cta'),
          { boxShadow: "0 10px 36px rgba(246,112,77,0.65)", duration: 0.9, ease: "sine.inOut",
            repeat: 4, yoyo: true }, 2.5);

        // FINAL SCENE: fade everything to black at the end
        // Scene duration is 9.8s. Narration ends at ~5.2s (scene-local).
        // CTA holds from 5.2 to 8.6, then fade over last 1.2s.
        tl.to(sel('#s5-root'),
          { opacity: 0, filter: "blur(10px)", duration: 1.2, ease: "power2.in" }, 8.6);

        window.__timelines["scene-5"] = tl;
