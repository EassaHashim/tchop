    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var sel = function (s) { return '[data-composition-id="scene-4"] ' + s; };

        // Meta row
        tl.from(sel('.meta-row .scene-tag'),
          { y: -20, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.1);
        tl.from(sel('.meta-row .timestamp'),
          { y: -20, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.2);

        // Sidebar slides in
        tl.from(sel('.sidebar'),
          { x: -60, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.25);

        // Agent avatar scales in a hair later
        tl.from(sel('.agent-avatar'),
          { scale: 0.5, opacity: 0, duration: 0.45, ease: "expo.out" }, 0.55);

        // Feed title
        tl.from(sel('.feed-title'),
          { x: 30, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.45);

        // Cards stagger in — synced to narration pacing within 6.8s scene
        // Narration beats relative to scene start (scene starts at composition t=14.0):
        //   "An agent reads a URL."    → 0.56-1.96s  → card 1 at 0.75
        //   "Tags it."                 → 1.96-2.63   → card 2 at 2.10
        //   "Slots into a channel."    → 2.63-3.80   → card 3 at 2.85
        //   "Schedules the push."      → 3.84-5.26   → card 4 at 4.00
        //   "Updates the status."      → 5.26-6.60   → card 5 at 5.35
        var cards = ['#tc-1', '#tc-2', '#tc-3', '#tc-4', '#tc-5'];
        var cardStarts = [0.75, 2.10, 2.85, 4.00, 5.35];
        cards.forEach(function (id, i) {
          var t = cardStarts[i];
          tl.from(sel(id), {
            x: 80,
            opacity: 0,
            scale: 0.96,
            filter: "blur(6px)",
            duration: 0.4,
            ease: "power3.out"
          }, t);
          // Status badge pops separately
          tl.fromTo(sel(id + ' .tc-status'),
            { scale: 0.5, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, t + 0.22);
        });

        // Counter ticks up from 00 to 05 synced with card entrances
        var countEl = document.querySelector(sel('#s4-count'));
        var countState = { n: 0 };
        cards.forEach(function (id, i) {
          var t = cardStarts[i] + 0.1;
          tl.to(countState, {
            n: i + 1,
            duration: 0.28,
            ease: "power2.out",
            onUpdate: function () {
              if (countEl) countEl.textContent = String(Math.round(countState.n)).padStart(2, '0');
            }
          }, t);
        });

        // Live dot pulse — finite repeats
        tl.to(sel('.live-dot'),
          { scale: 1.5, opacity: 0.4, duration: 0.55, ease: "sine.inOut",
            repeat: 5, yoyo: true }, 0.8);

        // Timestamp ticks subtly — increment seconds across the scene
        var tsEl = document.querySelector(sel('#s4-ts'));
        var tsState = { s: 14 };
        tl.to(tsState, {
          s: 21,
          duration: 6.5,
          ease: "none",
          onUpdate: function () {
            if (tsEl) {
              var n = Math.floor(tsState.s);
              tsEl.textContent = 't+00:' + String(n).padStart(2, '0');
            }
          }
        }, 0.3);

        window.__timelines["scene-4"] = tl;
      })();
    </script>
